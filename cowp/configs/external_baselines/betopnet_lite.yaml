external_baselines:
  baseline: betopnet_lite
  methods: [betopnet_lite]
  max_candidates: 24
  supervision_target: logged_nominal
  allow_teacher_supervision: false
  hard_weight: 12.0
  harm_weight: 2.0
  oracle_weight: 0.6
  topology_weight: 0.5
  model:
    arch: betopnet_lite
    max_candidates: 24
    # Compact OC-RAP adapter for the uploaded BeTopNet architecture.
    d_model: 256
    num_layers: 4
    num_heads: 8
    dropout: 0.10
    num_topology_agents: 16
    actor_topology_feature_dim: 16
    num_topology_map: 64
    map_topology_feature_dim: 14
    num_topo: 16
    future_len: 20
    topology_dt: 0.1
    topology_far_threshold_m: 30.0
    mlp_hidden: 128
    mlp_layers: 3
  training:
    # Avoid incompatible cuDNN SDPA execution-plan selection while retaining fast fused fallbacks.
    sdpa_backend: safe
    # Prefer BF16 only when the current GPU supports it; otherwise use FP16 + GradScaler.
    amp_dtype: auto
    device: auto
    distributed: auto
    batch_size: 64
    num_workers: 8
    epochs: 30
    lr: 0.0001
    weight_decay: 0.0002
    grad_clip: 5.0
    tqdm: true
    pin_memory: true
    find_unused_parameters: auto
  loss_weights:
    policy: 1.0
    topology: 1.0
    topology_topk_ratio: 0.25
    utility: 0.0
    hard: 0.0
    harm: 0.0
    oracle_rec: 0.0
    deploy_rec: 0.0
  policy:
    gamma_H: 0.0
    gamma_D: 5.0
    cvar_alpha: 0.20
    betop_hard_weight: 10.0
    betop_harm_weight: 1.5
    betop_utility_weight: 0.25
    betop_branch_weight: 0.5
    betop_topology_conf_weight: 0.25
