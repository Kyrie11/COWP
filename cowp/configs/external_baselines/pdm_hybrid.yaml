external_baselines:
  baseline: pdm_hybrid
  methods: [pdm_hybrid]
  max_candidates: 24
  supervision_target: logged_nominal
  allow_teacher_supervision: false
  model:
    arch: pdm_hybrid
    max_candidates: 24
    d_model: 128
    num_layers: 3
    num_heads: 4
    dropout: 0.10
    history_len: 11
    neighbors_to_predict: 8
    future_len: 20
  training:
    sdpa_backend: safe
    amp_dtype: auto
    device: auto
    distributed: auto
    batch_size: 96
    num_workers: 8
    epochs: 20
    lr: 0.0002
    weight_decay: 0.0001
    grad_clip: 5.0
    tqdm: true
    pin_memory: true
    find_unused_parameters: false
  loss_weights:
    policy: 1.0
    levelk: 0.0
    level_response: 0.0
    topology: 0.0
    gameformer_traj: 0.0
    pluto_contrastive: 0.0
    utility: 0.0
    hard: 0.0
    harm: 0.0
    oracle_rec: 0.0
    deploy_rec: 0.0
  policy:
    pdm_progress_weight: 5.0
    pdm_ttc_weight: 5.0
    pdm_comfort_weight: 2.0
    pdm_deviation_weight: 0.20
    pdm_backup_margin_weight: 0.10
    pdm_collision_probability_gate: 0.45
    pdm_min_clearance_gate_m: -0.25
    pdm_hybrid_learned_weight: 1.0
    pdm_hybrid_rule_weight: 1.0
