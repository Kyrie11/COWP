external_baselines:
  baseline: predictive_safety_filter
  methods: [predictive_safety_filter]
  max_candidates: 24
  policy:
    gamma_H: 0.0
    gamma_D: 5.0
    gamma_branch_rec: 0.0
    psf_gamma_branch_rec: 0.0
    psf_cbf_kappa: 0.50
    psf_cbf_slack: 0.05
    psf_accel_gate: 6.0
    psf_steer_gate: 0.75
    psf_hard_gate: 0.0
    psf_harm_gate: 5.0
    psf_hard_barrier_weight: 1.0
    psf_harm_barrier_weight: 0.25
    psf_deviation_weight: 2.0
    psf_utility_weight: 0.35
    psf_barrier_weight: 1.0
    psf_smoothness_weight: 0.15
  training:
    device: auto
    batch_size: 64
    epochs: 1
