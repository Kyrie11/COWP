time:
  dt: 0.1
  history_steps: 11
  future_steps: 80
  rollout_horizon_steps: 80
  short_label_horizon_steps: 50
dataset:
  require_interaction_heavy: true
  collect_scene_metadata: true
limits:
  max_agents: 128
  max_critical_agents: 6
  max_candidates: 64
  max_natural_alternatives: 24
  max_safe_responses: 32
  max_conflict_regions: 64
  max_roadgraph_points: 20000
candidate:
  map_filter_enabled: true
  map_filter_require_available: false
  map_filter_stride: 4
  map_filter_lane_point_stride: 2
  map_filter_min_lane_points: 64
  map_filter_local_radius_m: 140.0
  map_max_distance_vehicle_m: 5.0
  map_min_compliant_fraction: 0.8
  map_hard_max_distance_m: 12.0
  terminal_speed_offsets_mps:
  - -5
  - -3
  - -1
  - 0
  - 1
  - 3
  - 5
  terminal_s_offsets_m:
  - -25
  - -15
  - -8
  - 0
  - 8
  - 15
  - 25
  - 35
  terminal_lattice_speed_position_blend: 0.5
  dedup_endpoint_tolerance_m: 0.25
  dedup_speed_tolerance_mps: 0.25
  dedup_all_macro_types: false
  yield_decel_values_mps2:
  - -1.0
  - -2.0
  - -3.0
  accelerate_values_mps2:
  - 0.5
  - 1.0
  - 1.5
  stop_margin_to_conflict_m:
  - 2.0
  - 5.0
  - 8.0
  merge_time_offsets_s:
  - -2.0
  - -1.2
  - -0.4
  - 0.0
  - 0.4
  - 1.2
  - 2.0
  # Bidirectional Conflict-Time Envelope (BCTE) proposal coverage repair.
  timing_envelope_gap_s: [0.8, 1.4, 2.0]
  timing_envelope_max_agents: 6
  timing_envelope_agent_radius_m: 80.0
  timing_envelope_min_approach_cos: 0.15
  timing_envelope_min_accel_mps2: -3.5
  timing_envelope_max_accel_mps2: 2.5
  # v16.8.3 Robust Multi-Region BCTE (RMR-BCTE).
  timing_envelope_max_regions: 3
  timing_envelope_max_agents_per_region: 4
  timing_envelope_max_candidates: 24
  timing_envelope_accel_dedup_mps2: 0.10
  timing_envelope_agent_min_accel_mps2: -2.0
  timing_envelope_agent_max_accel_mps2: 2.0
  timing_envelope_agent_max_spread_s: 0.8
  # v16.8.4: reject RMR timing proposals whose realized conflict-entry TTA
  # disagrees with the advertised pass-before/pass-after target.
  timing_envelope_max_target_tta_error_s: 0.20
  # v16.8.6 PCHR is retained as an ablation, but the 191-scene probe generated
  # only 17 candidates and zero NCF candidates; it is disabled by default in v16.8.8.
  priority_hold_release_enabled: false
  priority_hold_release_max_candidates: 8
  priority_hold_release_stop_margin_m: [3.0, 5.0]
  priority_hold_release_speed_mps: [2.5, 3.5, 4.0]
  priority_hold_release_min_hold_s: 0.35
  priority_hold_release_gap_s: [0.8, 1.4, 2.0]
  # v16.8.8 Priority-Smooth-Yield (PSY): a more feasible protected-priority
  # commitment family.  It reaches the pass-after boundary with a low terminal
  # speed and requires an observable early speed drop, avoiding PCHR's full-stop
  # feasibility bottleneck.
  priority_smooth_yield_enabled: true
  priority_smooth_yield_max_candidates: 8
  priority_smooth_yield_terminal_speed_mps: [1.0, 2.0, 3.0]
  priority_smooth_yield_initial_decel_mps2: [-0.8, -1.4, -2.0]
  priority_smooth_yield_gap_s: [0.8, 1.4, 2.0]
  priority_smooth_yield_commitment_check_s: 1.0
  priority_smooth_yield_min_speed_drop_mps: 0.75
  lane_change_duration_s:
  - 2.5
  - 3.5
  - 4.5
  - 5.5
  lane_change_start_delay_s:
  - 0.0
  - 0.5
  - 1.0
  - 1.5
  - 2.0
  max_accel_mps2: 4.0
  max_decel_mps2: 6.0
  max_jerk_mps3: 10.0
  max_curvature_inv_m: 0.2
  min_valid_horizon_steps: 50
  ignore_initial_jerk_steps: 3
  jerk_check_percentile: 99.0
conflict:
  tta_delta_threshold: 3.0
  conflict_time_buffer: 0.8
  intersection_radius_m: 5.0
  merge_radius_m: 8.0
  lane_intersection_heading_threshold_deg: 30.0
  same_direction_heading_threshold_deg: 30.0
priority:
  priority_delay_tolerance_s: 0.8
  priority_progress_loss_tolerance_m: 5.0
  arrival_order_margin_s: 0.5
  max_comfort_decel_vehicle: -3.0
  max_comfort_accel_vehicle: 2.5
  max_comfort_jerk_vehicle: 3.0
  gap_loss_threshold_m: 6.0
  gap_loss_threshold_s: 1.0
critical:
  # v16.8.8: global critical-agent selection must not depend on the optional
  # proposal bank; otherwise adding proposals can relabel every old candidate.
  selection_reference_mode: fixed_anchor_v1
  anchor_lane_offset_m: 3.5
  anchor_lane_change_delay_s: 0.5
  max_current_distance_m: 40.0
  max_future_distance_m: 15.0
  always_keep_current_distance_m: 18.0
  current_distance_requires_future_or_conflict: true
  min_score: 1.5
  tta_delta_threshold: 3.0
  vehicle_only_main: false
natural:
  obs_speed_scale:
  - 0.85
  - 0.95
  - 1.0
  - 1.05
  - 1.15
  obs_time_shift_s:
  - -0.5
  - 0.0
  - 0.5
  obs_lateral_offset_m:
  - -0.3
  - 0.0
  - 0.3
  max_obs_samples: 8
  neutral_acc_values_mps2:
  - -1.0
  - -0.5
  - 0.0
  - 0.5
  - 1.0
  neutral_target_speed_offsets_mps:
  - -2.0
  - 0.0
  - 2.0
  max_neutral_samples: 8
  prio_acc_values_mps2:
  - -0.5
  - 0.0
  - 0.5
  prio_speed_min_mps: 0.0
  prio_max_samples: 8
  min_natural_alternatives: 6
  source_weight_obs: 1.0
  source_weight_neu: 0.8
  source_weight_prio: 1.2
  sigma_traj_m: 15.0
  sigma_b: 0.5
  map_filter_enabled: true
  map_filter_require_available: false
  map_filter_stride: 4
  map_min_compliant_fraction: 0.8
  map_max_distance_vehicle_m: 5.0
  map_max_distance_vru_m: 8.0
  map_hard_max_distance_m: 12.0
  obs_decontamination_enabled: true
  obs_pressure_radius_m: 12.0
  obs_neutral_relief_scale_m: 6.0
  obs_contamination_weight: 0.9
  obs_drop_contamination_above: 0.9
  obs_weight_floor: 0.05
response:
  safe_budget_search:
    enabled: true
    beam_width: 16
    max_return: 16
    unsafe_penalty: 100.0
    hard_profile_penalty: 0.25
    comfort_decel_values_mps2:
    - -1.0
    - -1.5
    - -2.0
    hard_decel_values_mps2:
    - -3.0
    - -4.0
    - -5.0
    reaction_delays_s:
    - 0.0
    - 0.3
    - 0.6
    recover_accel_values_mps2:
    - 0.0
    - 0.5
    lateral_slack_offsets_m:
    - -0.25
    - 0.25
  response_acc_values_mps2:
  - -4.5
  - -3.5
  - -2.5
  - -1.5
  - -0.5
  - 0.0
  - 0.5
  - 1.0
  response_start_delay_s:
  - 0.0
  - 0.3
  - 0.6
  - 1.0
  response_duration_s:
  - 1.0
  - 2.0
  - 3.0
  emergency_decel_values_mps2:
  - -6.0
  - -8.0
  emergency_reaction_delay_s:
  - 0.0
  - 0.2
  - 0.5
  max_response_primitives_per_agent: 72
  max_predicted_responses_per_agent: 8
  max_emergency_responses_per_agent: 4
  root_conditioned_transport:
    enabled: true
    max_roots_per_agent: 24
    profiles:
    - accel_mps2: 0.0
      start_delay_s: 0.0
      duration_s: 1.0
    - accel_mps2: -1.5
      start_delay_s: 0.2
      duration_s: 2.0
    - accel_mps2: 0.75
      start_delay_s: 0.2
      duration_s: 1.5
    label_search_profiles:
    - accel_mps2: 0.0
      start_delay_s: 0.0
      duration_s: 1.0
    - accel_mps2: -0.75
      start_delay_s: 0.1
      duration_s: 1.5
    - accel_mps2: -1.5
      start_delay_s: 0.0
      duration_s: 2.0
    - accel_mps2: -2.5
      start_delay_s: 0.0
      duration_s: 2.5
    - accel_mps2: -3.5
      start_delay_s: 0.0
      duration_s: 1.5
    - accel_mps2: -1.5
      start_delay_s: 0.4
      duration_s: 2.5
    - accel_mps2: 0.5
      start_delay_s: 0.1
      duration_s: 1.5
    - accel_mps2: 1.0
      start_delay_s: 0.0
      duration_s: 2.0
    - accel_mps2: 1.5
      start_delay_s: 0.0
      duration_s: 1.5
  root_assignment_horizons_s:
  - 1.0
  - 3.0
  - 5.0
  - 8.0
  root_assignment_temperature_m: 2.0
  root_assignment_min_affinity: 0.35
