time:
  dt: 0.1
  history_steps: 11
  future_steps: 80
  rollout_horizon_steps: 80
  short_label_horizon_steps: 50

dataset:
  # The paper's label construction is intended for interaction-heavy scenes.
  # Keeping this enabled prevents the label builder from filling the cache with
  # ordinary cruising scenes that have no meaningful coercion witness.
  require_interaction_heavy: true
  collect_scene_metadata: true

limits:
  max_agents: 128
  # Keep only the most relevant interaction partners.  The witness condition is
  # universal over critical agents; filling every slot with merely nearby agents
  # makes NCF candidates artificially rare and multiplies label-engine cost.
  max_critical_agents: 6
  max_candidates: 64
  max_natural_alternatives: 24
  max_safe_responses: 32
  max_conflict_regions: 64
  max_roadgraph_points: 20000

candidate:
  terminal_speed_offsets_mps: [-5, -3, -1, 0, 1, 3, 5]
  terminal_s_offsets_m: [-25, -15, -8, 0, 8, 15, 25, 35]
  # Blend terminal speed and terminal progress targets into the acceleration
  # primitive; without this, terminal_s_offsets_m changes only the utility, not
  # the geometry, and the lattice collapses to many duplicates.
  terminal_lattice_speed_position_blend: 0.5
  dedup_endpoint_tolerance_m: 0.25
  dedup_speed_tolerance_mps: 0.25
  dedup_all_macro_types: false
  yield_decel_values_mps2: [-1.0, -2.0, -3.0]
  accelerate_values_mps2: [0.5, 1.0, 1.5]
  stop_margin_to_conflict_m: [2.0, 5.0, 8.0]
  merge_time_offsets_s: [-2.0, -1.2, -0.4, 0.0, 0.4, 1.2, 2.0]
  lane_change_duration_s: [2.5, 3.5, 4.5, 5.5]
  lane_change_start_delay_s: [0.0, 0.5, 1.0, 1.5, 2.0]
  max_accel_mps2: 4.0
  max_decel_mps2: 6.0
  max_jerk_mps3: 6.0
  max_curvature_inv_m: 0.2
  min_valid_horizon_steps: 50

conflict:
  tta_delta_threshold: 3.0
  conflict_time_buffer: 0.8
  intersection_radius_m: 5.0
  merge_radius_m: 8.0
  lane_intersection_heading_threshold_deg: 30.0
  same_direction_heading_threshold_deg: 30.0

priority:
  priority_delay_tolerance_s: 0.8
  priority_progress_loss_tolerance_m: 5.0
  arrival_order_margin_s: 0.5
  max_comfort_decel_vehicle: -3.0
  max_comfort_accel_vehicle: 2.5
  max_comfort_jerk_vehicle: 3.0
  gap_loss_threshold_m: 6.0
  gap_loss_threshold_s: 1.0

critical:
  max_current_distance_m: 40.0
  max_future_distance_m: 15.0
  # Very nearby agents are always kept; farther agents need either future
  # proximity, shared conflict, priority, or objects-of-interest evidence.
  always_keep_current_distance_m: 18.0
  current_distance_requires_future_or_conflict: true
  min_score: 1.5
  tta_delta_threshold: 3.0
  vehicle_only_main: false

natural:
  obs_speed_scale: [0.85, 0.95, 1.0, 1.05, 1.15]
  obs_time_shift_s: [-0.5, 0.0, 0.5]
  obs_lateral_offset_m: [-0.3, 0.0, 0.3]
  max_obs_samples: 8
  neutral_acc_values_mps2: [-1.0, -0.5, 0.0, 0.5, 1.0]
  neutral_target_speed_offsets_mps: [-2.0, 0.0, 2.0]
  max_neutral_samples: 8
  prio_acc_values_mps2: [-0.5, 0.0, 0.5]
  prio_speed_min_mps: 0.0
  prio_max_samples: 8
  min_natural_alternatives: 6
  source_weight_obs: 1.0
  source_weight_neu: 0.8
  source_weight_prio: 1.2
  sigma_traj_m: 15.0
  sigma_b: 0.5

response:
  safe_budget_search:
    enabled: true
    beam_width: 16
    max_return: 16
    unsafe_penalty: 100.0
    hard_profile_penalty: 0.25
    comfort_decel_values_mps2: [-1.0, -1.5, -2.0]
    hard_decel_values_mps2: [-3.0, -4.0, -5.0]
    reaction_delays_s: [0.0, 0.3, 0.6]
    recover_accel_values_mps2: [0.0, 0.5]
    lateral_slack_offsets_m: [-0.25, 0.25]
  response_acc_values_mps2: [-4.5, -3.5, -2.5, -1.5, -0.5, 0.0, 0.5, 1.0]
  response_start_delay_s: [0.0, 0.3, 0.6, 1.0]
  response_duration_s: [1.0, 2.0, 3.0]
  emergency_decel_values_mps2: [-6.0, -8.0]
  emergency_reaction_delay_s: [0.0, 0.2, 0.5]
  # The stored tensor keeps only max_safe_responses anyway.  This cap keeps the
  # primitive bank source-balanced while avoiding 100+ safety/burden evaluations
  # for every (ego candidate, critical agent) pair.
  max_response_primitives_per_agent: 48
  max_predicted_responses_per_agent: 8
  max_emergency_responses_per_agent: 4

unsafe:
  collision_inflation_m: 0.1
  near_miss_distance_vehicle_m: 1.0
  near_miss_distance_vru_m: 1.5
  ttc_min_vehicle_s: 1.5
  ttc_distance_gate_vehicle_m: 15.0
  ttc_min_vru_s: 2.0
  ttc_distance_gate_vru_m: 20.0
  rss_reaction_time_s: 0.5
  rss_a_max_accel: 2.0
  rss_b_min_comfort: 3.0
  rss_b_max_front: 6.0
  rss_min_gap_m: 2.0
  severe_offroad_distance_m: 4.0

burden:
  beta0_vehicle: 0.65
  beta0_cyclist: 0.55
  beta0_pedestrian: 0.50
  beta_min: 0.45
  beta_max: 0.85
  low_speed_threshold_mps: 5.0
  dense_neighbor_count_radius_m: 30.0
  dense_neighbor_count_threshold: 8
  weights:
    acc: 0.25
    jerk: 0.10
    prog: 0.20
    risk: 0.20
    option: 0.15
    norm: 0.10
  vehicle:
    a_comf_pos: 2.0
    a_comf_neg: -3.0
    a_hard_pos: 4.0
    a_hard_neg: -6.0
    j_comf: 3.0
    j_hard: 8.0
    delay_norm_s: 4.0
    progress_loss_norm_m: 20.0
  cyclist:
    a_comf_pos: 1.5
    a_comf_neg: -2.5
    a_hard_pos: 3.0
    a_hard_neg: -5.0
    j_comf: 2.5
    j_hard: 7.0
    delay_norm_s: 4.0
    progress_loss_norm_m: 15.0
  pedestrian:
    a_comf_pos: 1.0
    a_comf_neg: -1.5
    a_hard_pos: 2.0
    a_hard_neg: -3.0
    j_comf: 1.5
    j_hard: 5.0
    delay_norm_s: 4.0
    progress_loss_norm_m: 8.0

ncf:
  alpha_opr: 0.35
  gamma: 0.10
  min_alt_weight: 0.03
  positive_min_natural_conflict_mass: 0.10

planning:
  p_hard: 0.75
  p_soft: 0.45
  alpha_opr_infer: 0.35
  ncf_gamma_infer: 0.10
  fallback_decel_mps2: -2.0
  emergency_decel_mps2: -6.0


diagnostics:
  # Soft distributional checks used by 06_diagnose_dataset.py. They are not
  # hard schema invariants; they flag whether the generated labels look useful
  # for the paper's false-safe / non-coercive supervision setting.
  min_mean_candidate_valid: 12.0
  min_mean_critical_valid: 1.0
  max_mean_critical_valid: 6.5
  min_scenes_with_ncf_candidate_ratio: 0.35
  min_mean_candidate_endpoint_spread_m: 6.0
  target_positive_pair_ratio: [0.02, 0.35]
  target_false_safe_candidate_ratio: [0.05, 0.45]
  target_ncf_candidate_ratio: [0.10, 0.80]
  min_stress_eligible_scene_ratio: 0.01
  min_response_safe_pair_ratio: 0.60
  min_mean_natural_alternatives: 4.0
  min_mechanism_token_types: 4
  min_waymax_rollout_candidate_ratio: 0.90
