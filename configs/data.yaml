womd:
  scenario_proto_glob: /data0/senzeyu2/dataset/WOMD/waymo_open_dataset_motion_v_1_3_1/uncompressed/scenario/training/*.tfrecord*
  tfexample_glob: /data0/senzeyu2/dataset/WOMD/waymo_open_dataset_motion_v_1_3_1/uncompressed/tf_example/training/*.tfrecord*
  validation_proto_glob: /data0/senzeyu2/dataset/WOMD/waymo_open_dataset_motion_v_1_3_1/uncompressed/scenario/validation/*.tfrecord*
  validation_tfexample_glob: /data0/senzeyu2/dataset/WOMD/waymo_open_dataset_motion_v_1_3_1/uncompressed/tf_example/validation/*.tfrecord*

  # 给 COWP 普通 TFRecord parser 用，保留 glob 没问题；
  # 但 Waymax dataloader 更适合使用 @shards 格式。
  waymax_path: /data0/senzeyu2/dataset/WOMD/waymo_open_dataset_motion_v_1_3_1/uncompressed/tf_example/training/training_tfexample.tfrecord@1000
  validation_waymax_path: /data0/senzeyu2/dataset/WOMD/waymo_open_dataset_motion_v_1_3_1/uncompressed/tf_example/validation/validation_tfexample.tfrecord@150

  include_sdc_paths: true
  waymax_config_name: WOD_1_3_1_TRAINING
  validation_waymax_config_name: WOD_1_3_1_VALIDATION
outputs:
  root: outputs/cowp
  index_jsonl: outputs/cowp/cowp_index.jsonl
  labels_dir: outputs/cowp/labels
  waymax_rollout_labels_dir: outputs/cowp/labels_waymax_rollout
  tensor_cache_dir: outputs/cowp/tensor_cache
  stress_dir: outputs/cowp/stress_set
  stress_manifest: outputs/cowp/stress_set/cowp_stress_manifest.jsonl
  diagnostics_dir: outputs/cowp/diagnostics

splits:
  train: 0.70
  val: 0.15
  test: 0.15
  seed: 2026
