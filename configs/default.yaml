  teacher_pcd_direct_ranking_weight: 2.5
  teacher_pcd_direct_nominal_penalty_weight: 1.0
  teacher_pcd_direct_false_positive_weight: 1.5
  teacher_pcd_direct_margin: 0.18
  teacher_pcd_direct_min_teacher_pcd_gain: 0.015
  teacher_pcd_direct_min_teacher_best_pcd: 0.50
  teacher_pcd_direct_max_nominal_teacher_pcd: 0.68
  teacher_pcd_direct_target_min_pred_pcd: 0.52
  teacher_pcd_direct_nominal_max_pred_pcd: 0.50
  teacher_pcd_direct_focus_non_nominal_weight: 2.0
  teacher_pcd_direct_false_positive_margin: 0.03
  teacher_pcd_direct_positive_rank_all_weight: 0.0
  teacher_pcd_direct_positive_floor_weight: 0.0
