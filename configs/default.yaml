dataset_quality:
  # Off by default for broad natural-WOMD sweeps. Enable only for artifact/stress
  # datasets that are intended to support FRA, ODG, and anti-oracle claims.
  require_artifact_pairs: false
  # filter = old behavior: keep only prefixes with a complete hidden yield/accelerate pair.
  # tag = keep all prefixes and only tag artifact pairs.
  # balanced = keep a bounded mix of artifact and non-artifact prefixes per scene-time.
  artifact_pair_mode: tag
  # 0 means keep every accepted prefix. If positive, this is a *saved sample* cap,
  # not the tqdm prefix-attempt count.
  max_accepted_prefixes_per_scene_time: 0
  min_artifact_prefixes_per_scene_time: 1
  max_artifact_prefixes_per_scene_time: 2
  min_nonartifact_prefixes_per_scene_time: 1
  max_nonartifact_prefixes_per_scene_time: 6
  macro_diversity_first: true
  # balanced mode can now deliberately materialize no-mine and mine variants
  # on distinct prefixes so a primary set does not collapse into stress-only data.
  balanced_two_pass: true
  # Rotate prefix order per scene-time in balanced builds. This prevents small
  # smoke sets from always selecting only nominal/keep/brake/yield.
  balanced_rotate_prefix_order: true
  balanced_keep_nominal_nonartifact: true
  require_nominal_per_scene_time: true
  keep_nominal_even_if_quality_fails: true
  min_accepted_prefixes_per_scene_time: 2
  # Optional group-level regime gates. Useful for clean normal/background shards.
  # Example: require_nominal_regimes=[normal] or forbid_nominal_regimes=[near_contact,post_contact,oracle_artifact].
  require_nominal_regimes: []
  forbid_nominal_regimes: []
  require_any_regimes: []
  forbid_any_regimes: []
  # Reserve uniform planning frames when max_biased_times_per_scenario would
  # otherwise fill every slot; set to 1-2 for primary WOMD benchmark builds.
  min_uniform_times_per_scenario: 0
  artifact_pass_use_margin_override: true
  artifact_quota_uses_label: true
  warn_if_artifact_fraction_above: 0.80
  warn_if_scene_count_below: 50
  min_obs_negative_fraction_per_sample: 0.0
  # Optional strict per-sample quality gates for clean safe/normal shards.
  # null means disabled. Setting both to 0.0 keeps only non-negative
  # deployable/oracle-recoverable samples.
  min_deployable_score_per_sample: null
  min_oracle_score_per_sample: null
  # When true, an underfull scene-time is dropped instead of being backfilled
  # with samples that failed quality gates.
  drop_scene_time_if_under_min_quality: false
  require_negative_deployable_sample: false
  negative_deployable_threshold: 0.0
