baselines:
  risk_lambda: 1.0
  idm_harm_lambda: 2.0
  idm_hard_lambda: 15.0
metrics:
  sigma_u: 1.0
closed_loop:
  max_scenarios: 8
  # In normal mode, max_scenarios is the number of WOMD scenes to roll out.
  # In bucket mode, max_rollouts is the number of scene/time starts to evaluate,
  # while raw_max_scenarios controls how far to scan the raw WOMD stream.
  max_rollouts: null
  raw_max_scenarios: null
  # Optional OC-RAP offline dataset root(s). When set, closed-loop evaluation
  # starts only from scene_id/time_index pairs mined into those regime datasets.
  bucket_dataset: null
  bucket_split: ''
  max_bucket_targets: 0
  max_targets_per_scene: 1
  start_time_index: null
  max_steps: 40
  replan_interval_steps: 1
  method: ocrap
  # fast = online inference only; skips per-candidate counterfactual teacher
  # labels at every replan. Use all/full only for small strict audits.
  label_mode: fast
  # fast: no teacher labels. selected: label only executed candidate. all: label every candidate.
  audit_every_n_steps: 1
  audit_max_labels: 0
  audit_top_k: 4
  audit_max_extra_candidates: 5
  # Optional closed-loop-only candidate cap. Leave null to use num_candidate_prefixes.
  num_candidate_prefixes: null
  # Optional closed-loop-only recovery-option count. Set to the option count used
  # during dataset construction, e.g. 12 for the commands in 数据集构建指令.txt.
  num_recovery_options: null
  artifact_mine_probability: 0.0
  # Set true only when the raw WOMD shards contain path_samples/* SDC-route
  # features; otherwise Waymax parsing will require path_samples/arc_length.
  use_sdc_paths: false
  render: false
  save_trace_npz: false
  save_partial: true
  # Scene/target-level resume. Completed rollouts are skipped; an interrupted
  # in-progress scene is rerun from its deterministic Waymax reset state.
  resume: true
  resume_force: false
  # Allows resuming old *.json.partial files created before fingerprints/journals.
  resume_allow_legacy_partial: true
  # fsync every scene journal record only when maximum crash durability is needed.
  resume_fsync: false
  # Full aggregate JSON snapshots are O(number_of_completed_scenes); write them
  # every few scenes while the append-only journal records every completed scene.
  partial_write_every_scenes: 4
  progress: true
  progress_every_steps: 5
  allow_infinite_gamma: false
  force_teacher_baselines: false
progress: true
io:
  # Compression saves disk, but can become CPU-bound during dataset construction.
  # For speed profiling on local NVMe, use --set io.compress_npz=false.
  compress_npz: true
  # Keep true for robust final runs. For local profiling/smoke runs, false avoids
  # a synchronous disk flush after every sample.
  fsync_npz: true
# Dataset-source sharding for multi-process builds, e.g. two GPUs with
# CUDA_VISIBLE_DEVICES=0/1 and scenario_stride=2, scenario_worker_index=0/1.
scenario_start_index: 0
scenario_stride: 1
scenario_worker_index: 0
profiling:
  # Print per-scenario / per-scene-time / per-prefix build timings. Useful when
  # no npz appears for a long time because samples are only written after a
  # full scene-time group has finished materializing.
  enabled: false
  log_every_sample: false
  slow_sample_s: 30.0
  slow_scene_time_s: 120.0
  profile_flush_scene_times: 1
  profile_csv_fsync: false

waymax:
  # Make scene ids robust even when the dataloader payload omits or repeats
  # scenario/id. This is required for scene-level train/calibration/test splits.
  append_scenario_index_to_id: true
  # Reuse stateless Waymax BaseEnvironment objects with identical config. This
  # also improves reuse of jitted scan rollout functions.
  cache_env_objects: true
  # Exact cache for repeated post-prefix constant-control futures produced from
  # the same Waymax state/environment. This avoids rerolling duplicate SDC stress
  # variants without changing their trajectory or priors.
  cache_postprefix_rollouts: true
  # Exact cache for the Waymax-metric part of hybrid teacher rows. Futures that
  # share the same post-prefix simulator state/env still keep their own
  # branch-specific structural margins; only the deterministic recovery metric
  # rollout is reused.
  cache_teacher_metric_rollouts: true
  # Speed path: moves constant-control future rollouts and final-metric
  # recovery-teacher rollouts into one jax.lax.scan dispatch. This is now the
  # default because per-step Python/JAX Waymax dispatch is prohibitively slow on
  # WOMD smoke builds; set false only when debugging Waymax/JAX compatibility.
  use_jit_scan_rollouts: true
  # Metadata diagnostics only; disabling them speeds smoke/profiling builds
  # without changing OC-MERO labels.
  compute_future_metrics: true
  detect_natural_hidden_emergence: true
  # auto = structural teacher for artifact override sanity/stress builds, hybrid
  # otherwise. Use waymax for a strict runtime-only teacher, or structural for
  # fast label generation from the recovery-affordance teacher.
  teacher_backend: auto
  # 0 records only the final recovery metric and enables one-scan recovery
  # rollout. This is the recommended dataset-build default; set 1 to restore
  # legacy every-step metrics when running a deliberately strict audit.
  teacher_metrics_stride: 0
  # Optional screened hybrid teacher: 0 keeps the exact current behavior and
  # rolls every recovery option in Waymax.  A positive value first computes the
  # structural teacher for all options, then runs expensive Waymax recovery
  # rollouts only for the top-k options per future.  Use for smoke/debug builds;
  # final strict benchmark should normally use 0 unless reported as screened.
  teacher_rollout_top_k_options: 0
  # Additional option modes to always include in screened hybrid rollouts.
  teacher_rollout_option_modes: []
  apply_artifact_override_to_screened_options: true
  skip_waymax_rollout_for_augmented_override: false
ablation:
  without_observation_kernel: false
  without_lower_tail: false
  without_calibration: false
  without_anti_oracle: false
  full_future_roots: false
  no_occlusion_bev: false
  encoder_type: mlp
  transformer_layers: 2
  transformer_heads: 4
  dropout: 0.1
