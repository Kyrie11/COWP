  force_mine: true
  # 1.0 preserves the old artifact-sanity behavior. For a primary WOMD build,
  # use 0.10-0.30 so the dataset contains both oracle-artifact stress cases
  # and non-artifact/nominal candidates needed for NUP, calibration, and test.
  mine_probability: 1.0
  # Keep true for synthetic artifact fixtures. For primary WOMD labels, set to false
  # to avoid hand-coded artifact-branch margins and rely on teacher rollouts.
  use_margin_override: true
  # Strong negative margin for the deliberately mined incompatible branch.  The
  # hidden yield/accelerate roots each have small prior mass; if this is only
  # mildly negative, lower-tail deployable recovery can stay positive and the
  # generated stress set will contain ODG but no FRA/anti-oracle samples.
