# Main-table contact/post-impact baselines. These are post-impact control or
# recovery methods; pre-impact unavoidable-collision severity planners are kept
# only as legacy/supplementary baselines.
external_baselines:
  baseline: postimpact_mpc_lite
  methods:
    - postimpact_mpc_lite
    - post_crash_braking
    - postimpact_motion_tvlqr
    - post_collision_restoration
    - compensatory_postimpact_mpc
    - robust_postimpact_control
  max_candidates: 24
  policy:
    contact_dt: 0.1
    contact_mu: 0.75
    vehicle_mass: 1750.0
    vehicle_iz: 2350.0

    risk_dt: 0.1
    risk_clearance_buffer_m: 0.75
    risk_clearance_scale_m: 2.0
    risk_collision_temperature_m: 0.8
    risk_severity_speed_mps: 12.0
    backup_deceleration_mps2: 5.0
    backup_reaction_time_s: 0.25
    cvar_alpha: 0.20

    # Wang et al. 2023 planning-integrated post-impact MPC.
    postimpact_dt: 0.1
    postimpact_mu: 0.75
    postimpact_sbd_margin: 4.0
    postimpact_sbd_wrong_mode_penalty: 1.5
    postimpact_sbd_terminal_speed_weight: 0.35
    postimpact_lane_change_lateral_weight: 0.08
    postimpact_yaw_rate_weight: 1.4
    postimpact_yaw_acc_weight: 0.15
    postimpact_terminal_speed_weight: 0.25
    postimpact_accel_weight: 0.08
    postimpact_steer_weight: 0.08
    postimpact_jerk_weight: 0.02
    postimpact_adhesion_weight: 1.1
    postimpact_expected_risk_weight: 5.0
    postimpact_cvar_risk_weight: 2.5
    postimpact_severity_weight: 1.5
    postimpact_rejoin_weight: 0.20
    postimpact_yaw_rate_gate: 2.2
    postimpact_adhesion_gate: 1.25
    postimpact_risk_gate: 1.25

    # Lu et al. 2017 autonomous post-impact braking / stable stop.
    stable_stop_terminal_speed_weight: 1.8
    stable_stop_yaw_rate_weight: 2.0
    stable_stop_yaw_acc_weight: 0.20
    stable_stop_expected_risk_weight: 6.0
    stable_stop_cvar_risk_weight: 3.0
    stable_stop_steer_weight: 0.20
    stable_stop_jerk_weight: 0.04
    stable_stop_non_stop_macro_penalty: 2.0
    stable_stop_utility_tiebreak: 0.03
    stable_stop_terminal_speed_gate: 2.0
    stable_stop_yaw_rate_gate: 1.4
    stable_stop_risk_gate: 1.25

    # Wang et al. 2022 polynomial/APF motion planning + TVLQR tracking adapter.
    tvlqr_lateral_weight: 1.2
    tvlqr_heading_weight: 1.0
    tvlqr_yaw_rate_weight: 1.5
    tvlqr_yaw_acc_weight: 0.15
    tvlqr_apf_risk_weight: 4.5
    tvlqr_cvar_weight: 2.0
    tvlqr_control_weight: 0.12
    tvlqr_control_rate_weight: 0.05
    tvlqr_progress_weight: 0.10
    tvlqr_yaw_rate_gate: 2.2
    tvlqr_risk_gate: 1.5

    # Ghosh et al. 2026 heuristic steering/tractive-force restoration.
    restoration_tau0: 0.1
    restoration_tau1: 0.45
    restoration_tau2: 0.65
    restoration_tau3: 0.95
    restoration_tauc1: 0.35
    restoration_tauc2: 0.85
    restoration_A1: 0.175
    restoration_A2: -0.10
    restoration_accel_pulse: 0.9
    restoration_kdir: 1.0
    restoration_shape_weight: 0.8
    restoration_yaw_rate_weight: 1.1
    restoration_lateral_weight: 0.25
    restoration_expected_risk_weight: 4.0
    restoration_cvar_risk_weight: 2.0
    restoration_speed_preservation_weight: 2.0
    restoration_min_speed_fraction: 0.45
    restoration_admit_min_speed_fraction: 0.30
    restoration_adhesion_weight: 0.75
    restoration_utility_weight: 0.25
    restoration_yaw_rate_gate: 2.2
    restoration_risk_gate: 1.5

    # Cao et al. 2021 FCC-MPC via AFS + differential torque vectoring.
    comp_mpc_lateral_weight: 1.4
    comp_mpc_heading_weight: 1.1
    comp_mpc_yaw_rate_weight: 1.5
    comp_mpc_yaw_acc_weight: 0.12
    comp_mpc_control_weight: 0.16
    comp_mpc_control_rate_weight: 0.05
    comp_mpc_adhesion_weight: 1.0
    comp_mpc_expected_risk_weight: 4.0
    comp_mpc_cvar_weight: 2.0
    comp_mpc_utility_weight: 0.10
    comp_mpc_yaw_rate_gate: 2.2
    comp_mpc_risk_gate: 1.5

    # Ao et al. 2022 sliding-mode + fault-tolerant convex-QP allocation.
    robust_pic_lambda_y: 0.8
    robust_pic_lambda_heading: 0.7
    robust_pic_adhesion_target: 0.9
    robust_pic_surface_y_weight: 1.4
    robust_pic_surface_heading_weight: 1.6
    robust_pic_yaw_rate_weight: 1.2
    robust_pic_adhesion_weight: 1.2
    robust_pic_control_rate_weight: 0.08
    robust_pic_expected_risk_weight: 4.5
    robust_pic_cvar_weight: 2.5
    robust_pic_adhesion_gate: 1.30
    robust_pic_risk_gate: 1.5
  training:
    validate_dataset: true
    device: cpu
    epochs: 1

closed_loop:
  label_mode: fast
  force_teacher_baselines: false
  external_sparse_labels: true
  exhaustive_teacher_labels: false
  num_recovery_options: 12
  save_partial: false
  num_candidate_prefixes: 24
  replan_interval_steps: 1
  artifact_mine_probability: 0.0

waymax:
  compute_future_metrics: false
  teacher_metrics_stride: 0
  teacher_rollout_top_k_options: 4
  dataloader_include_sdc_paths: false
  metrics_to_run: [log_divergence, overlap, offroad, kinematic_infeasibility]
