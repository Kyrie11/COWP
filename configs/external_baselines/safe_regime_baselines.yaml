external_baselines:
  baseline: betopnet_lite
  methods:
    - nominal_replay
    - wayformer_bc
    - gameformer_lite
    - betopnet_lite
  max_candidates: 24
  hard_weight: 12.0
  harm_weight: 2.0
  oracle_weight: 0.8
  topology_weight: 0.5
  model:
    arch: betopnet_lite
    max_candidates: 24
    d_model: 256
    num_layers: 4
    num_heads: 8
    dropout: 0.10
    num_topology_agents: 16
    actor_topology_feature_dim: 16
    num_topology_map: 64
    map_topology_feature_dim: 14
    num_topo: 16
    future_len: 20
  training:
    device: auto
    distributed: auto
    batch_size: 64
    num_workers: 8
    epochs: 28
    lr: 0.00015
    weight_decay: 0.0002
    grad_clip: 5.0
    tqdm: true
    pin_memory: true
    find_unused_parameters: auto
  loss_weights:
    policy: 1.0
    topology: 0.35
    utility: 0.10
    hard: 0.35
    harm: 0.20
    oracle_rec: 0.25
    deploy_rec: 0.05
  policy:
    gamma_H: 0.0
    gamma_D: 5.0
    gamma_oracle_rec: 0.0
    gameformer_hard_weight: 12.0
    gameformer_harm_weight: 2.0
    gameformer_oracle_weight: 1.0
    betop_hard_weight: 10.0
    betop_harm_weight: 1.5
    betop_utility_weight: 0.25
    betop_branch_weight: 0.5
    betop_topology_conf_weight: 0.25
