external_baselines:
  baseline: dro_cvar_filter
  methods: [expected_risk_filter, cvar_risk_filter, dro_cvar_filter]
  max_candidates: 24
  policy:
    gamma_H: 0.0
    gamma_D: 5.0
    gamma_branch_rec: 0.0
    cvar_alpha: 0.20
    risk_hard_weight: 1.0
    risk_harm_weight: 0.25
    risk_deviation_weight: 0.05
    expected_risk_threshold: 0.45
    expected_risk_weight: 3.0
    cvar_risk_threshold: 0.55
    cvar_risk_weight: 3.0
    dro_ambiguity_radius: 0.10
    dro_cvar_threshold: 0.65
    dro_cvar_risk_weight: 3.5
  training:
    device: auto
    batch_size: 64
    epochs: 1
