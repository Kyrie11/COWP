external_baselines:
  baseline: gameformer_lite
  methods:
    - nominal_replay
    - wayformer_bc
    - route_bc_lite
    - gameformer_lite
    - betopnet_lite
    - marc_lite
    - racp_lite
    - expected_risk_filter
    - cvar_risk_filter
    - dro_cvar_filter
    - postimpact_mpc_lite
  max_candidates: 24
  hard_weight: 12.0
  harm_weight: 2.0
  oracle_weight: 1.0
  model:
    arch: gameformer_levelk
    max_candidates: 24
    d_model: 256
    num_layers: 4
    num_heads: 8
    dropout: 0.10
    num_levels: 4
    modalities: 6
    future_len: 20
    history_len: 11
    neighbors_to_predict: 8
    num_roots: 10
    num_options: 12
    root_feature_dim: 18
    num_topology_agents: 16
    actor_topology_feature_dim: 16
    num_topology_map: 64
    map_topology_feature_dim: 14
    num_topo: 16
  training:
    device: auto
    distributed: auto
    batch_size: 64
    num_workers: 8
    epochs: 28
    lr: 0.00015
    weight_decay: 0.0002
    grad_clip: 5.0
    tqdm: true
    pin_memory: true
    find_unused_parameters: auto
  loss_weights:
    policy: 1.0
    levelk: 0.35
    level_response: 0.10
    gameformer_traj: 0.35
    topology: 1.0
    topology_topk_ratio: 0.25
    utility: 0.10
    hard: 0.50
    harm: 0.25
    oracle_rec: 0.75
    deploy_rec: 0.10
  policy:
    gamma_H: 0.0
    gamma_D: 5.0
    gamma_oracle_rec: 0.0
    gamma_branch_rec: 0.0
    cvar_alpha: 0.20
    gameformer_hard_weight: 12.0
    gameformer_harm_weight: 2.0
    gameformer_oracle_weight: 1.0
    betop_hard_weight: 10.0
    betop_harm_weight: 1.5
    betop_utility_weight: 0.25
    betop_branch_weight: 0.5
    betop_topology_conf_weight: 0.25
    marc_risk_tolerance: 0.35
    marc_branch_rec_weight: 1.0
    marc_hard_weight: 10.0
    marc_harm_weight: 1.5
    racp_risk_tolerance: 0.60
    racp_branch_rec_weight: 1.0
    racp_hard_weight: 10.0
    racp_harm_weight: 1.5
    risk_hard_weight: 1.0
    risk_harm_weight: 0.25
    expected_risk_threshold: 0.45
    expected_risk_weight: 3.0
    cvar_risk_threshold: 0.35
    cvar_risk_weight: 3.0
    dro_ambiguity_radius: 0.10
    dro_cvar_threshold: 0.40
    dro_cvar_risk_weight: 3.5
    postimpact_gamma: 0.0
    postimpact_dt: 0.1
    postimpact_yaw_rate_weight: 1.4
    postimpact_yaw_acc_weight: 0.15
    postimpact_terminal_speed_weight: 0.45
    postimpact_accel_weight: 0.08
    postimpact_steer_weight: 0.08
    postimpact_jerk_weight: 0.02
    postimpact_hard_weight: 8.0
    postimpact_harm_weight: 2.5
    postimpact_rejoin_weight: 0.20
    postimpact_shared_drs_weight: 3.0
    postimpact_yaw_rate_gate: 2.2
    postimpact_hard_gate: 0.0
