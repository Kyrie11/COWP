external_baselines:
  baseline: marc_lite
  methods: [marc_lite]
  max_candidates: 24
  policy:
    gamma_H: 0.0
    gamma_D: 5.0
    gamma_branch_rec: 0.0
    cvar_alpha: 0.20
    branch_divergence_threshold_m: 1.0
    max_branch_fraction: 0.60
    marc_risk_tolerance: 0.35
    marc_utility_weight: 1.0
    marc_branch_rec_weight: 1.0
    marc_common_prefix_weight: 0.35
    marc_oracle_mass_weight: 0.25
    marc_expected_risk_weight: 2.0
    marc_fail_weight: 1.0
    marc_smoothness_weight: 0.15
    marc_deviation_weight: 0.10
    marc_hard_weight: 10.0
    marc_harm_weight: 1.5
    marc_risk_threshold: 1.0
  training:
    device: auto
    batch_size: 64
    epochs: 1
