train:
  seed: 2026
  batch_size: 8
  epochs: 10
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 4
  stage: witness
  device: auto
  positive_pair_oversampling: true
  max_positive_pairs_per_scene: 8
  max_negative_pairs_per_scene: 16

loss_weights:
  obs_prediction: 1.0
  neutral: 0.5
  priority_rule: 0.5
  diversity: 0.05
  response_safe_bce: 1.0
  response_low_bce: 1.0
  response_burden_l1: 0.5
  witness_exist: 2.0
  witness_token: 1.0
  witness_burden: 0.5
  witness_conflict: 0.3
  witness_opr: 0.5
  imitation: 1.0
  ranking: 1.0
  candidate_ncf_cls: 1.0
