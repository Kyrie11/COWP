train:
  seed: 2026
  batch_size: 8
  epochs: 10
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 4
  stage: all
  device: auto
  positive_pair_oversampling: true
  max_positive_pairs_per_scene: 8
  max_negative_pairs_per_scene: 16

loss_weights:
  obs_prediction: 1.0
  neutral: 0.5
  priority_rule: 0.5
  diversity: 0.05
  natural_traj_l1: 1.0
  natural_mode_ce: 0.5
  branch_source_ce: 0.4
  branch_minade: 0.7
  priority_preservation: 0.4
  neutral_consistency: 0.3
  diversity_loss: 0.05
  natural_diversity_tau: 4.0
  response_safe_bce: 1.0
  response_low_bce: 1.0
  response_burden_l1: 0.5
  response_components_l1: 0.25
  response_traj_l1: 0.1
  witness_exist: 2.0
  witness_token: 1.0
  witness_burden: 0.5
  witness_burden_components: 0.25
  witness_conflict: 0.3
  witness_opr: 0.5
  witness_focal_gamma: 2.0
  witness_focal_alpha: 0.75
  witness_mining_max_pos_per_scene: 16
  witness_mining_max_neg_per_scene: 48
  witness_mining_neg_pos_ratio: 3
  witness_mining_min_neg_per_scene: 8
  imitation: 1.0
  ranking: 1.0
  candidate_ncf_cls: 1.0
  candidate_false_safe_cls: 0.5
