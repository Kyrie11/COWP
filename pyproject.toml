[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cowp-project"
version = "0.1.0"
description = "COWP non-coercive feasibility dataset, model, and Waymax evaluation pipeline."
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["cowp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
